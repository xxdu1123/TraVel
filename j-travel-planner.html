<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧳 J人旅行攻略生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f5f3fa;color:#333;min-height:100vh;}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;position:relative;padding-bottom:80px;box-shadow:0 0 20px rgba(0,0,0,0.05);}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:20px 16px 24px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:100;}
.header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
.header .subtitle{font-size:12px;opacity:0.85;margin-top:4px;}
.steps{display:flex;justify-content:space-between;margin-top:16px;gap:4px;}
.step{flex:1;text-align:center;cursor:pointer;user-select:none;}
.step.disabled{cursor:not-allowed;pointer-events:none;opacity:0.55;}
.step-num{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.3);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-bottom:4px;}
.step.active .step-num{background:#fff;color:#764ba2;}
.step.done .step-num{background:#4ade80;color:#fff;}
.step-label{font-size:10px;opacity:0.9;}
.step.done .step-label,.step.active .step-label{opacity:1;}

.main{padding:16px;}
.section-title{font-size:16px;font-weight:700;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.section-title .num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;}

.selected-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:12px;background:#f5f3fa;border-radius:12px;min-height:44px;}
.selected-tags:empty::before{content:'还没有选择城市哦～点击下方省份卡片开始';color:#999;font-size:13px;}
.city-tag{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:6px 10px 6px 12px;border-radius:20px;font-size:12px;display:inline-flex;align-items:center;gap:6px;}
.city-tag .remove{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;}

.search-box{display:flex;gap:8px;margin-bottom:16px;}
.search-box input{flex:1;padding:10px 14px;border:2px solid #e8e4f0;border-radius:12px;font-size:14px;outline:none;transition:all 0.3s;}
.search-box input:focus{border-color:#764ba2;}
.search-box button{padding:10px 16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.province-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.province-card{padding:14px 8px;background:#fff;border:2px solid #e8e4f0;border-radius:14px;text-align:center;cursor:pointer;transition:all 0.25s;font-size:13px;font-weight:600;color:#555;}
.province-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(118,75,162,0.15);}
.province-card.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent;}
.back-btn{display:inline-flex;align-items:center;gap:4px;padding:10px 16px;background:#f5f3fa;border:2px solid #e8e4f0;border-radius:20px;font-size:13px;color:#764ba2;cursor:pointer;margin-bottom:12px;font-weight:600;transition:all 0.2s;position:relative;z-index:5;}
.back-btn:hover{background:#fff;border-color:#764ba2;}
.back-btn:active{transform:scale(0.96);}

.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.city-card{padding:12px 6px;background:#fff;border:2px solid #e8e4f0;border-radius:12px;text-align:center;cursor:pointer;transition:all 0.25s;font-size:12px;position:relative;}
.city-card:hover{border-color:#764ba2;}
.city-card.selected{background:linear-gradient(135deg,#eef0ff,#f3ebff);border-color:#764ba2;color:#764ba2;font-weight:600;}
.city-card .check{position:absolute;top:4px;right:4px;width:18px;height:18px;background:#764ba2;color:#fff;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;}

.tabs{display:flex;background:#f5f3fa;border-radius:12px;padding:4px;margin-bottom:16px;gap:4px;}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;border-radius:10px;cursor:pointer;color:#666;font-weight:500;transition:all 0.2s;}
.tab.active{background:#fff;color:#764ba2;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.08);}

.city-panel{background:#fff;border:2px solid #e8e4f0;border-radius:16px;padding:14px;margin-bottom:14px;}
.city-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0ecf5;}
.city-panel-title{font-size:15px;font-weight:700;color:#333;display:flex;align-items:center;gap:6px;}
.remove-city{color:#ff6b6b;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:8px;}
.remove-city:hover{background:#fff0f0;}

.sight-list{display:flex;flex-direction:column;gap:10px;}
.sight-item{display:flex;gap:10px;padding:12px 10px;background:#faf8ff;border-radius:10px;align-items:flex-start;cursor:pointer;transition:all 0.15s;border:2px solid transparent;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:rgba(118,75,162,0.06);}
.sight-item:hover{border-color:#ded4ee;background:#f3ebff;}
.sight-item:active{transform:scale(0.99);}
.sight-item.selected{border-color:#764ba2;background:#f3ebff;}
.food-item{display:flex;align-items:center;gap:10px;padding:12px 10px;background:#fff8f0;border-radius:10px;cursor:pointer;transition:all 0.15s;border:2px solid transparent;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:rgba(217,119,6,0.05);}
.food-item:hover{border-color:#fed7aa;}
.food-item.selected{border-color:#d97706;background:#fff7ed;}
.checkbox{width:22px;height:22px;border:2px solid #d4cce0;border-radius:50%;flex-shrink:0;cursor:pointer;position:relative;top:2px;transition:all 0.18s;background:#fff;pointer-events:none;}
.checkbox.checked{background:linear-gradient(135deg,#667eea,#764ba2);border-color:transparent;}
.checkbox.checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;font-weight:bold;}
.sight-info{flex:1;pointer-events:none;}
.sight-name{font-size:13px;font-weight:600;color:#333;}
.sight-meta{font-size:11px;color:#888;margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;}
.sight-meta span{display:inline-flex;align-items:center;gap:2px;}
.sight-tip{font-size:11px;color:#764ba2;margin-top:6px;background:#f3ebff;padding:5px 8px;border-radius:6px;line-height:1.5;}
.sight-duration{background:#fff;padding:2px 6px;border-radius:4px;color:#667eea;font-weight:600;}
.sight-price{background:#fff;padding:2px 6px;border-radius:4px;color:#f59e0b;font-weight:600;}
.food-name{font-size:13px;font-weight:600;color:#333;pointer-events:none;}
.food-desc{font-size:11px;color:#888;margin-top:3px;pointer-events:none;}

.area-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.area-card{padding:12px;background:#faf8ff;border:2px solid #e8e4f0;border-radius:10px;cursor:pointer;transition:all 0.2s;}
.area-card.selected{border-color:#764ba2;background:#f3ebff;}
.area-name{font-size:13px;font-weight:600;color:#333;}
.area-desc{font-size:11px;color:#888;margin-top:4px;}

.config-section{margin-bottom:16px;}
.config-label{font-size:13px;font-weight:600;color:#555;margin-bottom:8px;}
.days-config{display:flex;align-items:center;gap:12px;background:#f5f3fa;padding:10px 14px;border-radius:10px;}
.days-label{font-size:13px;color:#555;flex-shrink:0;}
.days-btns{display:flex;align-items:center;gap:10px;}
.day-btn{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #e8e4f0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:600;color:#764ba2;}
.day-btn:active{background:#f3ebff;}
.day-count{font-size:18px;font-weight:700;color:#764ba2;min-width:30px;text-align:center;}

.budget-tabs{display:flex;background:#f5f3fa;border-radius:12px;padding:4px;gap:4px;}
.budget-tab{flex:1;padding:12px 8px;text-align:center;border-radius:10px;cursor:pointer;font-size:12px;transition:all 0.2s;}
.budget-tab.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.08);font-weight:700;}
.budget-tab .emoji{font-size:20px;display:block;margin-bottom:4px;}
.budget-tab .label{color:#666;}
.budget-tab.active .label{color:#764ba2;}
.budget-tab.cheap.active{background:linear-gradient(135deg,#d1fae5,#a7f3d0);}
.budget-tab.cheap.active .label{color:#059669;}
.budget-tab.mid.active{background:linear-gradient(135deg,#dbeafe,#bfdbfe);}
.budget-tab.mid.active .label{color:#2563eb;}
.budget-tab.comfort.active{background:linear-gradient(135deg,#fce7f3,#fbcfe8);}
.budget-tab.comfort.active .label{color:#db2777;}

.generate-btn{width:100%;padding:16px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(118,75,162,0.4);transition:all 0.2s;margin-top:16px;}
.generate-btn:active{transform:scale(0.98);}
.generate-btn:disabled{opacity:0.5;cursor:not-allowed;}

.result-header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:20px 16px;border-radius:0 0 24px 24px;margin-bottom:16px;}
.result-header h2{font-size:18px;margin-bottom:8px;}
.result-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.summary-item{background:rgba(255,255,255,0.2);padding:10px 6px;border-radius:10px;}
.summary-value{font-size:18px;font-weight:700;}
.summary-label{font-size:10px;opacity:0.9;margin-top:2px;}

.day-card{background:#fff;border:2px solid #e8e4f0;border-radius:16px;margin-bottom:14px;overflow:hidden;}
.day-header{background:linear-gradient(135deg,#f3ebff,#eef0ff);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
.day-title{font-size:14px;font-weight:700;color:#764ba2;}
.day-city{font-size:12px;background:#fff;padding:4px 10px;border-radius:20px;color:#667eea;font-weight:600;}
.transit-header{background:linear-gradient(135deg,#fef3c7,#fde68a);padding:12px 14px;}
.transit-header .day-title{color:#92400e;}
.transit-header .day-city{background:#fff;color:#d97706;}

.time-line{padding:14px;position:relative;}
.time-line::before{content:'';position:absolute;left:34px;top:20px;bottom:20px;width:2px;background:linear-gradient(to bottom,#e8e4f0,#f5f3fa);}
.time-item{display:flex;gap:12px;margin-bottom:14px;position:relative;}
.time-item:last-child{margin-bottom:0;}
.time-badge{width:54px;flex-shrink:0;text-align:center;}
.time-value{font-size:13px;font-weight:700;color:#764ba2;background:#f3ebff;padding:4px 6px;border-radius:6px;}
.time-icon{width:20px;height:20px;background:#fff;border:2px solid #764ba2;border-radius:50%;margin:6px auto 0;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:10px;}
.time-content{flex:1;padding:10px 12px;background:#faf8ff;border-radius:10px;border:1px solid #f0ecf5;}
.time-content.checked{background:#f0fdf4;border-color:#bbf7d0;}
.time-title{font-size:13px;font-weight:600;color:#333;display:flex;align-items:center;gap:6px;}
.time-desc{font-size:11px;color:#888;margin-top:4px;}
.time-cost{font-size:11px;color:#f59e0b;margin-top:4px;font-weight:600;}

.pitfalls-card{background:#fff8f0;border:2px solid #fde68a;border-radius:16px;padding:14px;margin-bottom:14px;}
.pitfalls-title{font-size:14px;font-weight:700;color:#92400e;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.pitfall-item{font-size:12px;color:#78350f;padding:8px 10px;background:#fef3c7;border-radius:8px;margin-bottom:6px;line-height:1.5;}
.pitfall-item:last-child{margin-bottom:0;}
.pitfall-item::before{content:'⚠️ ';margin-right:2px;}

.luggage-card{background:#fff;border:2px solid #e8e4f0;border-radius:16px;padding:14px;margin-bottom:14px;}
.luggage-title{font-size:14px;font-weight:700;color:#333;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.luggage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.luggage-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#faf8ff;border-radius:8px;font-size:12px;}

.budget-card{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;}
.budget-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.budget-breakdown{display:flex;flex-direction:column;gap:8px;}
.budget-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.15);}
.budget-row:last-child{border-bottom:none;}
.budget-total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:12px;padding-top:12px;border-top:2px solid rgba(255,255,255,0.3);}

.footer-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fff;border-top:1px solid #e8e4f0;padding:10px 16px;display:flex;gap:10px;z-index:100;}
.footer-nav button{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;}
.btn-prev{background:#f5f3fa;color:#764ba2;}
.btn-next{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.btn-next:disabled{opacity:0.4;cursor:not-allowed;}

.template-guide{padding:12px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;margin-bottom:10px;}
.template-guide-title{font-size:13px;font-weight:700;color:#065f46;margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.template-guide-desc{font-size:12px;color:#047857;line-height:1.6;}

.empty-state{text-align:center;padding:40px 20px;color:#999;}
.empty-state .icon{font-size:48px;margin-bottom:12px;}
.empty-state .text{font-size:14px;}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;z-index:9999;animation:toastIn 0.3s;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-40%);}to{opacity:1;transform:translate(-50%,-50%);}}

.page{display:none;}
.page.active{display:block;}

input[type="checkbox"]{display:none;}
</style>
</head>

const CITY_KEYS = Object.keys(CITY_DATA);

function normalizeCityKey(input) {
  if (!input) return '';
  return String(input).toLowerCase().trim().replace(/[^a-z0-9\u4e00-\u9fa5]/g, '');
}

function getCityNameByKey(key) {
  const data = CITY_DATA[key];
  return data ? data.name : (CITY_ALIASES_REVERSE[key] || key);
}

const CITY_ALIASES_REVERSE = {};
(function buildReverseAlias(){
  for (const alias in CITY_ALIASES) {
    const key = CITY_ALIASES[alias];
    if (!CITY_ALIASES_REVERSE[key]) CITY_ALIASES_REVERSE[key] = alias;
  }
})();

function fuzzySearchCities(keyword) {
  const nk = normalizeCityKey(keyword);
  if (!nk) return [];
  const results = [];
  for (const alias in CITY_ALIASES) {
    if (normalizeCityKey(alias).includes(nk) || nk.includes(normalizeCityKey(alias))) {
      const key = CITY_ALIASES[alias];
      if (!results.includes(key)) results.push(key);
    }
  }
  for (const key of CITY_KEYS) {
    const data = CITY_DATA[key];
    if (!data) continue;
    const name = normalizeCityKey(data.name);
    if ((name.includes(nk) || nk.includes(name)) && !results.includes(key)) {
      results.push(key);
    }
  }
  for (const key of CITY_KEYS) {
    const data = CITY_DATA[key];
    if (!data) continue;
    const name = normalizeCityKey(data.name);
    let found = false;
    for (const ch of nk) if (name.includes(ch)) { found = true; break; }
    if (found && !results.includes(key)) results.push(key);
  }
  return results.slice(0, 10);
}

function getCityData(cityKey) {
  const nk = normalizeCityKey(cityKey);
  let key = null;
  for (const alias in CITY_ALIASES) {
    if (normalizeCityKey(alias) === nk) {
      key = CITY_ALIASES[alias];
      break;
    }
  }
  if (!key && CITY_KEYS.includes(cityKey)) key = cityKey;
  if (!key) {
    for (const k of CITY_KEYS) {
      const d = CITY_DATA[k];
      if (d && normalizeCityKey(d.name) === nk) { key = k; break; }
    }
  }
  if (key && CITY_DATA[key]) {
    const base = CITY_DATA[key];
    return {
      key: key,
      name: base.name,
      isTemplate: false,
      sights: (base.sights || []).map(s => ({...s, checked: false})),
      foods: (base.foods || []).map(f => ({...f, checked: false})),
      areas: (base.areas || []).map(a => ({...a, selected: false})),
      budget: base.budget || {cheap:300,mid:600,comfort:1200},
      pitfalls: base.pitfalls || [],
      luggage: base.luggage || [],
      days: 2
    };
  }
  const displayName = cityKey && cityKey.length > 0 ? cityKey : '未知城市';
  return generateCityTemplate(displayName);
}

function showToast(msg, duration = 2000) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), duration);
}

function parseDurationToHours(durStr) {
  if (!durStr) return 1.5;
  const s = String(durStr);
  if (s.includes('全天')) return 8;
  if (s.includes('天')) {
    const match = s.match(/(\d+\.?\d*)/);
    return match ? parseFloat(match[1]) * 8 : 8;
  }
  const range = s.match(/(\d+\.?\d*)\s*[-~至]\s*(\d+\.?\d*)/);
  if (range) return (parseFloat(range[1]) + parseFloat(range[2])) / 2;
  const single = s.match(/(\d+\.?\d*)/);
  return single ? parseFloat(single[1]) : 1.5;
}

function parsePriceToNum(priceStr) {
  if (!priceStr) return 0;
  const s = String(priceStr);
  if (s.includes('免费') || s.includes('免票')) return 0;
  const range = s.match(/(\d+)\s*[-~至/]\s*(\d+)/);
  if (range) return (parseInt(range[1]) + parseInt(range[2])) / 2;
  const singles = s.match(/(\d+)/g);
  if (singles && singles.length > 0) return parseInt(singles[singles.length - 1]);
  return 0;
}

function addCity(keyOrName, forceKey = null) {
  state.searchLoading = true;
  render();
  return new Promise(resolve => {
    setTimeout(() => {
      let matchedKey = null;
      const input = String(keyOrName || '').trim();
      if (!input) {
        state.searchLoading = false;
        showToast('请输入城市名称');
        resolve(false);
        render();
        return;
      }
      if (forceKey && CITY_DATA[forceKey]) {
        matchedKey = forceKey;
      }
      if (!matchedKey) {
        const nk = normalizeCityKey(input);
        for (const alias in CITY_ALIASES) {
          if (normalizeCityKey(alias) === nk) {
            matchedKey = CITY_ALIASES[alias];
            break;
          }
        }
      }
      if (!matchedKey) {
        if (CITY_KEYS.includes(input)) matchedKey = input;
      }
      if (!matchedKey) {
        for (const k of CITY_KEYS) {
          const d = CITY_DATA[k];
          if (d && normalizeCityKey(d.name) === normalizeCityKey(input)) {
            matchedKey = k;
            break;
          }
        }
      }
      if (!matchedKey) {
        const fuzzy = fuzzySearchCities(input);
        if (fuzzy.length > 0) {
          matchedKey = fuzzy[0];
          showToast('已匹配：' + getCityNameByKey(matchedKey));
        }
      }
      let cityConfig;
      if (matchedKey) {
        if (state.selectedCities.includes(matchedKey)) {
          state.searchLoading = false;
          showToast(getCityNameByKey(matchedKey) + ' 已经在行程中了～');
          resolve(false);
          render();
          return;
        }
        cityConfig = getCityData(matchedKey);
      } else {
        showToast('未找到' + input + '，为您生成通用攻略模板📌');
        cityConfig = getCityData(input);
      }
      const finalKey = cityConfig.key;
      state.selectedCities.push(finalKey);
      state.cityConfigs[finalKey] = cityConfig;
      state.sightTabIndex[finalKey] = 0;
      state.currentCityIndex = Math.max(0, state.selectedCities.length - 1);
      state.searchLoading = false;
      state.searchInput = '';
      state.searchResults = [];
      resolve(true);
      render();
    }, 600);
  });
}

function removeCity(key) {
  const idx = state.selectedCities.indexOf(key);
  if (idx >= 0) {
    state.selectedCities.splice(idx, 1);
    delete state.cityConfigs[key];
    delete state.sightTabIndex[key];
    if (state.currentCityIndex >= state.selectedCities.length) {
      state.currentCityIndex = Math.max(0, state.selectedCities.length - 1);
    }
    showToast('已移除该城市');
    render();
  }
}

function toggleProvince(provinceKey) {
  if (provinceKey === null) {
    state.currentProvince = null;
    render();
    return;
  }
  if (state.currentProvince === provinceKey) {
    state.currentProvince = null;
  } else {
    const p = PROVINCES.find(x => x.key === provinceKey);
    if (p) {
      if (p.cities.length === 1 && !['beijing','tianjin','shanghai','chongqing','hohhot','harbin','changchun'].includes(provinceKey)) {
        addCity(p.cities[0]);
        return;
      } else {
        state.currentProvince = provinceKey;
      }
    }
  }
  render();
}

function toggleCityInProvince(cityKey) {
  if (state.selectedCities.includes(cityKey)) {
    removeCity(cityKey);
  } else {
    addCity(cityKey, cityKey);
  }
}

function handleCheckbox(e, key, type, index) {
  if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
  const cfg = state.cityConfigs[key];
  if (!cfg) return;
  if (type === 'sight') {
    cfg.sights[index].checked = !cfg.sights[index].checked;
  } else if (type === 'food') {
    cfg.foods[index].checked = !cfg.foods[index].checked;
  }
  render();
}
const toggleCheckbox = handleCheckbox;

function goToStep(targetStep) {
  targetStep = parseInt(targetStep, 10);
  if (isNaN(targetStep) || targetStep < 1 || targetStep > 4) return;
  if (targetStep > state.step) {
    for (let s = state.step; s < targetStep; s++) {
      if (s === 1 && state.selectedCities.length === 0) {
        showToast('请至少选择1个城市哦～');
        return;
      }
      if (s === 1) {
        for (const key of state.selectedCities) {
          const cfg = state.cityConfigs[key];
          if (cfg.sights && cfg.sights.length > 0) {
            const topN = Math.min(4, cfg.sights.length);
            for (let i = 0; i < topN; i++) cfg.sights[i].checked = true;
          }
          if (cfg.foods && cfg.foods.length > 0) {
            const topN = Math.min(3, cfg.foods.length);
            for (let i = 0; i < topN; i++) cfg.foods[i].checked = true;
          }
        }
      }
      if (s === 2) {
        for (const key of state.selectedCities) {
          const cfg = state.cityConfigs[key];
          if (cfg.areas && cfg.areas.length > 0 && !cfg.areas.some(a => a.selected)) {
            cfg.areas[0].selected = true;
          }
        }
      }
      if (s === 3) {
        if (!generateItinerary()) return;
      }
    }
    state.step = targetStep;
  } else {
    state.step = targetStep;
  }
  window.scrollTo({top: 0, behavior: 'auto'});
  render();
}

function handleAreaSelect(e, key, areaIdx) {
  e.stopPropagation();
  const cfg = state.cityConfigs[key];
  if (!cfg) return;
  cfg.areas.forEach((a, i) => a.selected = (i === areaIdx ? !a.selected : false));
  render();
}

function handleDaysChange(key, delta) {
  const cfg = state.cityConfigs[key];
  if (!cfg) return;
  const newDays = Math.max(1, Math.min(15, (cfg.days || 2) + delta));
  cfg.days = newDays;
  render();
}

function setBudgetLevel(level) {
  state.budgetLevel = level;

}

function switchSightTab(key, idx) {
  state.sightTabIndex[key] = idx;

function nextStep() {
  goToStep(state.step + 1);
}

function prevStep() {
  if (state.step > 1) {
    state.step--;
    window.scrollTo({top: 0, behavior: 'auto'});
    render();

}

function backToStart() {
  state.step = 1;
  state.generatedItinerary = null;
  state.checkedItems = {};
  window.scrollTo({top: 0, behavior: 'smooth'});
  render();
}

function generateItinerary() {
  const cities = state.selectedCities;
  if (cities.length === 0) {
    showToast('请先选择城市');
    return false;
  }
  const itinerary = { cities: [], totalDays: 0, transitDays: 0, budget: {}, pitfalls: [], luggage: [] };
  let prevCityKey = null;
  for (let i = 0; i < cities.length; i++) {
    const key = cities[i];
    const cfg = state.cityConfigs[key];
    if (prevCityKey && i > 0) {
      itinerary.transitDays++;
      itinerary.cities.push({
        isTransit: true,
        key: '__transit_' + i,
        name: '中转日',
        fromCity: getCityNameByKey(prevCityKey),
        toCity: cfg.name
      });
    }
    const cityDays = cfg.days || 2;
    const selectedSights = (cfg.sights || []).filter(s => s.checked);
    const selectedFoods = (cfg.foods || []).filter(f => f.checked);
    const selectedArea = (cfg.areas || []).find(a => a.selected);
    const totalSightHours = selectedSights.reduce((sum, s) => sum + parseDurationToHours(s.duration), 0);
    const hoursPerDay = 10;
    const minDays = Math.max(1, Math.ceil(totalSightHours / hoursPerDay));
    const days = Math.max(cityDays, minDays);
    const hoursPerDayActual = totalSightHours > 0 ? totalSightHours / days : hoursPerDay;
    let sightQueue = [...selectedSights];
    let foodQueue = [...selectedFoods];
    const daysPlan = [];
    for (let d = 0; d < days; d++) {
      const dayPlan = [];
      let currentTime = 8 * 60 + 30;
      if (selectedArea) {
        dayPlan.push({ type: 'area', title: '🏨 抵达酒店入住 ' + selectedArea.name, desc: selectedArea.desc || '放下行李，轻装出门游玩', time: formatTime(currentTime), icon: '🏨' });
        currentTime += 45;
      }
      const maxHoursToday = hoursPerDayActual + 1;
      let hoursToday = 0;
      while (hoursToday < maxHoursToday && sightQueue.length > 0) {
        const sight = sightQueue.shift();
        const itemHours = parseDurationToHours(sight.duration);
        const minutes = Math.min(360, Math.round(itemHours * 60));
        const price = parsePriceToNum(sight.price);
        dayPlan.push({
          type: 'sight',
          title: '🏛️ ' + sight.name,
          desc: (sight.traffic ? '🚌 ' + sight.traffic + ' | ' : '') + (sight.tip || ''),
          price: price > 0 ? '门票 ¥' + price : '免费',
          duration: sight.duration,
          time: formatTime(currentTime),
          icon: '📍',
          sightKey: key + '_sight_' + (cfg.sights.indexOf(sight))
        });
        currentTime += minutes + 20;
        hoursToday += itemHours;
        if ((hoursToday < maxHoursToday - 0.5 || foodQueue.length > 0) && sightQueue.length > 0 && currentTime < 11.5 * 60) continue;
        if (currentTime >= 11.5 * 60 && currentTime <= 13 * 60 && foodQueue.length > 0) {
          const food = foodQueue.shift();
          dayPlan.push({
            type: 'food',
            title: '🍜 午餐：' + food.name,
            desc: food.desc || '午市体验当地招牌美食',
            price: '人均 ¥50-80',
            time: formatTime(12 * 60),
            icon: '🍽️',
            foodKey: key + '_food_' + (cfg.foods.indexOf(food))
          });
          currentTime = 13 * 60 + 30;
        }
      }
      if (foodQueue.length > 0 && !dayPlan.some(p => p.type === 'food' && p.title.includes('晚餐'))) {
        const food = foodQueue.shift();
        dayPlan.push({
          type: 'food',
          title: '🥘 晚餐：' + food.name,
          desc: food.desc || '晚市品尝地道特色菜',
          price: '人均 ¥60-100',
          time: formatTime(19 * 60),
          icon: '🍽️',
          foodKey: key + '_food_' + (cfg.foods.indexOf(food))
        });
      }
      if (dayPlan.length === 1) {
        dayPlan.push({
          type: 'free',
          title: '💤 自由活动/深度感受城市',
          desc: cfg.isTemplate ? '漫步老城区/逛本地市场/找咖啡馆发呆，深入体验' : '逛逛本地人的商圈、看场电影、体验夜生活',
          time: formatTime(14 * 60),
          icon: '✨'
        });
      }
      daysPlan.push(dayPlan);
    }
    itinerary.cities.push({
      isTransit: false,
      key: key,
      name: cfg.name,
      isTemplate: !!cfg.isTemplate,
      templateGuides: cfg.templateGuides || [],
      days: daysPlan,
      selectedArea: selectedArea,
      pitfalls: cfg.pitfalls || [],
      luggage: cfg.luggage || [],
      budgetLevel: cfg.budget || {cheap:300,mid:600,comfort:1200}
    });
    itinerary.totalDays += days;
    prevCityKey = key;
  }
  const lv = state.budgetLevel;
  const totalDays = itinerary.totalDays;
  const cityBudgets = itinerary.cities.filter(c => !c.isTransit).map(c => c.budgetLevel[lv] || 500);
  const avgBudget = cityBudgets.length > 0 ? cityBudgets.reduce((s,b)=>s+b,0) / cityBudgets.length : 500;
  const foodPercent = lv === 'cheap' ? 0.25 : lv === 'mid' ? 0.3 : 0.35;
  const hotelPercent = lv === 'cheap' ? 0.35 : lv === 'mid' ? 0.35 : 0.3;
  const ticketPercent = lv === 'cheap' ? 0.15 : lv === 'mid' ? 0.15 : 0.12;
  const transitPercent = lv === 'cheap' ? 0.1 : lv === 'mid' ? 0.1 : 0.08;
  const otherPercent = 1 - foodPercent - hotelPercent - ticketPercent - transitPercent;
  const perDayBudget = avgBudget;
  const totalBudget = Math.round(perDayBudget * totalDays + (itinerary.transitDays * 200));
  itinerary.budget = {
    hotel: Math.round(totalBudget * hotelPercent),
    food: Math.round(totalBudget * foodPercent),
    tickets: Math.round(totalBudget * ticketPercent),
    transit: Math.round(totalBudget * transitPercent + itinerary.transitDays * 300),
    other: Math.round(totalBudget * otherPercent),
    total: totalBudget,
    perDay: Math.round(perDayBudget),
    levelText: lv === 'cheap' ? '穷游背包' : lv === 'mid' ? '舒适适中' : '豪华享受',
    totalDays: totalDays + itinerary.transitDays
  };
  const allLuggage = [];
  for (const c of itinerary.cities.filter(c => !c.isTransit)) {
    for (const l of c.luggage) if (!allLuggage.includes(l)) allLuggage.push(l);
  }
  itinerary.luggage = allLuggage.slice(0, 10);
  const allPitfalls = [];
  for (const c of itinerary.cities.filter(c => !c.isTransit)) {
    for (const p of (c.pitfalls || []).slice(0, 6)) {
      const line = '【' + c.name + '】' + p;
      if (!allPitfalls.includes(line)) allPitfalls.push(line);
    }
  }
  itinerary.pitfalls = allPitfalls.slice(0, 12);
  itinerary.totalDaysActual = totalDays + itinerary.transitDays;
  state.generatedItinerary = itinerary;
  return true;
}

function formatTime(totalMinutes) {
  totalMinutes = Math.round(totalMinutes);
  let h = Math.floor(totalMinutes / 60) % 24;
  let m = totalMinutes % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function toggleItineraryChecked(e, itemKey) {
  e.stopPropagation();
  state.checkedItems[itemKey] = !state.checkedItems[itemKey];
  render();
}

function renderHeader() {
  const stepLabels = ['选城市','选景点','选住宿/天数','生成攻略','完成✅'];
  const current = state.step;
  let stepsHtml = '';
  for (let i = 1; i <= 4; i++) {
    const reached = i <= current || i < current;
    let cls = 'step' + (i === current ? ' active' : i < current ? ' done' : '');
    if (!reached) cls += ' disabled';
    stepsHtml += `<div class="${cls}" onclick="event.stopPropagation(); goToStep(${i});">
      <div class="step-num">${i < current ? '✓' : i}</div>
      <div class="step-label">${stepLabels[i-1]}</div>
    </div>`;
  }
  return `<div class="header">
    <h1>🧳 J人旅行攻略生成器</h1>
    <div class="subtitle">${state.generatedItinerary ? (state.selectedCities.map(k => getCityNameByKey(k)).join(' → ') + ' · ' + state.generatedItinerary.totalDaysActual + '天') : '选择喜欢的城市，安排专属你的完美行程'}</div>
    <div class="steps">${stepsHtml}</div>
  </div>`;
}

function renderSelectedTags() {
  if (state.selectedCities.length === 0) return '';
  let html = '<div class="selected-tags">';
  for (const key of state.selectedCities) {
    const name = getCityNameByKey(key);
    html += `<span class="city-tag">${name}<span class="remove" onclick="event.stopPropagation(); removeCity('${key}');">×</span></span>`;
  }
  return html + '</div>';
}

function onSearchInput(value) {
  state.searchInput = value;
  const q = value.trim();
  if (q) {
    state.searchResults = fuzzySearchCities(q).slice(0, 20);
    state.currentProvince = null;
  } else {
    state.searchResults = [];
  }
  render();
  const input = document.getElementById('citySearchInput');
  if (input) { input.focus(); input.setSelectionRange(value.length, value.length); }
}

function renderSearchBox() {
  const loadingHtml = state.searchLoading ? '<span class="loading-spinner"></span>' : '🔍 添加';
  return `<div class="search-box">
    <input type="text" id="citySearchInput" placeholder="输入城市名（如：北京、拉萨、三亚）" value="${escapeHtml(state.searchInput)}" oninput="onSearchInput(this.value);" onkeydown="if(event.key==='Enter'){event.preventDefault(); addCity(this.value);}" />
    <button onclick="event.stopPropagation(); addCity(document.getElementById('citySearchInput').value);" ${state.searchLoading ? 'disabled' : ''}>${loadingHtml}</button>
  </div>`;
}

function renderProvinceView() {
  if (state.currentProvince) {
    const p = PROVINCES.find(x => x.key === state.currentProvince);
    if (!p) return '';
    let cityHtml = '';
    for (const cityKey of p.cities) {
      const cityData = CITY_DATA[cityKey];
      const name = cityData ? cityData.name : (CITY_ALIASES_REVERSE[cityKey] || cityKey);
      const selected = state.selectedCities.includes(cityKey);
      cityHtml += `<div class="city-card ${selected ? 'selected' : ''}" onclick="event.stopPropagation(); toggleCityInProvince('${cityKey}');">
        ${name}${selected ? '<span class="check">✓</span>' : ''}
      </div>`;
    }
    return `<button class="back-btn" onclick="event.stopPropagation(); toggleProvince(null);">← 返回省份列表</button>
    <div class="section-title"><span class="num">📍</span> ${p.name} · 选择城市（可多选）</div>
    <div class="city-grid">${cityHtml}</div>`;
  }
  let html = '<div class="section-title"><span class="num">1</span> 选择省份 → 进入城市列表</div><div class="province-grid">';
  for (const p of PROVINCES) {
    html += `<div class="province-card" onclick="event.stopPropagation(); toggleProvince('${p.key}');">${p.name}</div>`;
  }
  return html + '</div>';
}

function renderStep1() {
  let html = renderSelectedTags();
  html += renderSearchBox();
  const hasQuery = state.searchInput && state.searchInput.trim().length > 0;
  if (hasQuery) {
    if (state.searchResults.length > 0) {
      html += '<div class="section-title"><span class="num">🔎</span> 搜索结果（点击添加）</div><div class="city-grid">';
      for (const key of state.searchResults) {
        const name = getCityNameByKey(key);
        const selected = state.selectedCities.includes(key);
        html += `<div class="city-card ${selected ? 'selected' : ''}" onclick="event.stopPropagation(); addCity('${key}','${key}');">${name}${selected ? '<span class="check">✓</span>' : ''}</div>`;
      }
      html += '</div>';
    } else {
      html += '<div class="empty-state" style="padding:24px;"><div class="icon">🔍</div><div class="text">没有找到「' + escapeHtml(state.searchInput) + '」相关城市<br>试试输入城市名或别名，如"徽州"匹配黄山</div></div>';
    }
  } else {
    html += renderProvinceView();
  }
  return html;
}

function renderBudgetPreview() {
  let total = 0;
  const lv = state.budgetLevel;
  for (const key of state.selectedCities) {
    const cfg = state.cityConfigs[key];
    if (!cfg) continue;
    const perDay = cfg.budget ? cfg.budget[lv] : 500;
    total += perDay * (cfg.days || 2);
  }
  const cityN = state.selectedCities.length;
  const transit = cityN > 1 ? (cityN - 1) * 200 : 0;
  const grand = total + transit;
  const totalDays = state.selectedCities.reduce((s, k) => {
    const c = state.cityConfigs[k];
    return s + (c ? (c.days || 2) : 2);
  }, 0) + Math.max(0, cityN - 1);
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
    <div>🏙️ 城市数：<b>${cityN} 个</b></div>
    <div>📅 总天数：<b>${totalDays} 天</b></div>
    <div>🛏️ 住宿+餐饮：<b>¥${Math.round(grand * 0.65)}</b></div>
    <div>🎫 门票+中转：<b>¥${Math.round(grand * 0.35)}</b></div>
    <div style="grid-column:span 2;font-size:14px;color:#764ba2;font-weight:700;margin-top:4px;">💵 ${lv === 'cheap' ? '穷游' : lv === 'mid' ? '舒适' : '豪华'}总预算：≈ ¥${grand}（${Math.round(grand/totalDays)}/天）</div>
  </div>`;
}

function renderStep4() {
  const iti = state.generatedItinerary;
  if (!iti) {
    nextStep();
    return '';
  }
  const html = `<div class="result-header">
    <h2>🎉 你的专属旅行攻略已生成</h2>
    <div class="result-summary">
      <div class="summary-item"><div class="summary-value">${iti.totalDaysActual}</div><div class="summary-label">总天数(含中转)</div></div>
      <div class="summary-item"><div class="summary-value">${iti.cities.filter(c=>!c.isTransit).length}</div><div class="summary-label">游玩城市</div></div>
      <div class="summary-item"><div class="summary-value">¥${iti.budget.total}</div><div class="summary-label">${iti.budget.levelText}总预算</div></div>
    </div>
  </div>
  ${renderItineraryDays(iti)}
  ${renderAllPitfalls(iti)}
  ${renderLuggageList(iti)}
  ${renderBudgetCard(iti)}
  <button class="generate-btn" onclick="event.stopPropagation(); backToStart();">🔄 重新规划新的行程</button>`;
  return html;
}

function renderItineraryDays(iti) {
  let dayCounter = 1;
  let html = '';
  for (const city of iti.cities) {
    if (city.isTransit) {
      html += `<div class="day-card">
        <div class="transit-header day-header">
          <div class="day-title">第 ${dayCounter} 天 · 🚄 中转日</div>
          <div class="day-city">${escapeHtml(city.fromCity)} → ${escapeHtml(city.toCity)}</div>
        </div>
        <div class="time-line">
          <div class="time-item"><div class="time-badge"><div class="time-value">09:00</div><div class="time-icon">🧳</div></div>
            <div class="time-content"><div class="time-title">🏨 酒店退房 + 行李寄存</div><div class="time-desc">整理物品，贵重物品随身带，大件可寄存在前台</div></div>
          </div>
          <div class="time-item"><div class="time-badge"><div class="time-value">11:30</div><div class="time-icon">🚄</div></div>
            <div class="time-content"><div class="time-title">🚌 前往高铁站/机场/客运站</div><div class="time-desc">建议提前1.5-2小时到车站，节假日更要提前</div><div class="time-cost">市内交通 ¥30-80</div></div>
          </div>
          <div class="time-item"><div class="time-badge"><div class="time-value">15:30</div><div class="time-icon">🏙️</div></div>
            <div class="time-content"><div class="time-title">📍 抵达 ${escapeHtml(city.toCity)}</div><div class="time-desc">打车/公交前往酒店，沿途感受城市氛围</div><div class="time-cost">城际交通 ¥150-500</div></div>
          </div>
          <div class="time-item"><div class="time-badge"><div class="time-value">19:00</div><div class="time-icon">🍽️</div></div>
            <div class="time-content"><div class="time-title">🥘 晚餐：本地特色美食探索</div><div class="time-desc">放下行李，去${escapeHtml(city.toCity)}老城区找本地人多的馆子</div><div class="time-cost">人均 ¥60-120</div></div>
          </div>
        </div>
      </div>`;
      dayCounter++;
      continue;
    }
    if (city.isTemplate && city.templateGuides && city.templateGuides.length > 0) {
      for (const g of city.templateGuides) {
        html += `<div class="city-panel" style="margin-bottom:14px;border-color:#a7f3d0;">
          <div class="city-panel-header"><div class="city-panel-title" style="color:#065f46;">📌 ${escapeHtml(city.name)} · 通用攻略说明</div></div>
          <div class="template-guide" style="margin:0;"><div class="template-guide-title">${g.title}</div><div class="template-guide-desc">${g.desc}</div></div>
        </div>`;
      }
    }
    for (let d = 0; d < city.days.length; d++) {
      const dayPlan = city.days[d];
      html += `<div class="day-card">
        <div class="day-header">
          <div class="day-title">第 ${dayCounter} 天 · ${escapeHtml(city.name)} 第${d+1}天</div>
          <div class="day-city">📍 ${escapeHtml(city.name)}</div>
        </div>
        <div class="time-line">`;
      for (const p of dayPlan) {
        const itemKey = p.sightKey || p.foodKey || (city.key + '_' + dayCounter + '_' + Math.random().toString(36).slice(2,8));
        const isChecked = state.checkedItems[itemKey] ? 'checked' : '';
        const onClick = p.sightKey || p.foodKey ? `onclick="event.stopPropagation(); toggleItineraryChecked(event,'${itemKey}');"` : '';
        const checkHtml = p.sightKey || p.foodKey ? `<div class="checkbox ${isChecked}" style="position:absolute;top:8px;right:8px;" ${onClick}></div>` : '';
        html += `<div class="time-item">
          <div class="time-badge"><div class="time-value">${p.time}</div><div class="time-icon">${p.icon || '📍'}</div></div>
          <div class="time-content ${isChecked}" style="position:relative;">
            ${checkHtml}
            <div class="time-title">${p.title}</div>
            <div class="time-desc">${escapeHtml(p.desc || '')}</div>
            ${p.price ? `<div class="time-cost">${p.price}</div>` : ''}
          </div>
        </div>`;
      }
      html += `</div></div>`;
      dayCounter++;
    }
  }
  return html;
}

function renderAllPitfalls(iti) {
  if (!iti.pitfalls || iti.pitfalls.length === 0) return '';
  let html = `<div class="pitfalls-card">
    <div class="pitfalls-title">⚠️ 避坑指南 · 真实提醒</div>`;
  for (const p of iti.pitfalls.slice(0, 12)) {
    html += `<div class="pitfall-item">${escapeHtml(p)}</div>`;
  }
  return html + '</div>';
}

function renderLuggageList(iti) {
  const luggage = iti.luggage && iti.luggage.length > 0 ? iti.luggage : [
    '身份证+学生证（必带）','舒适运动鞋（走路巨多）','大容量充电宝',
    '防晒霜SPF50+','雨伞/一次性雨衣','薄外套（空调/早晚）',
    '水杯（环保省钱）','肠胃药/感冒药','洗漱旅行套装','太阳帽+墨镜'
  ];
  let html = `<div class="luggage-card">
    <div class="luggage-title">🎒 行李清单 · 10项必备（勾选确认）</div>
    <div class="luggage-grid">`;
  for (let i = 0; i < luggage.length; i++) {
    const key = 'lug_' + i;
    const checked = state.checkedItems[key] ? 'checked' : '';
    html += `<div class="luggage-item">
      <div class="checkbox ${checked}" onclick="event.stopPropagation(); toggleItineraryChecked(event,'${key}');"></div>
      <span>${escapeHtml(luggage[i])}</span>
    </div>`;
  }
  return html + '</div></div>';
}

function renderBudgetCard(iti) {
  const b = iti.budget;
  return `<div class="budget-card">
    <div class="budget-title">💰 预算明细 · ${b.levelText}档（${b.totalDays}天${iti.transitDays ? '含'+iti.transitDays+'中转' : ''}）</div>
    <div class="budget-breakdown">
      <div class="budget-row"><span>🛏️ 住宿 (${b.totalDays}晚)</span><span>¥${b.hotel}</span></div>
      <div class="budget-row"><span>🍜 餐饮 (${b.totalDays}天)</span><span>¥${b.food}</span></div>
      <div class="budget-row"><span>🎫 景点门票</span><span>¥${b.tickets}</span></div>
      <div class="budget-row"><span>🚄 城际+市内交通${iti.transitDays ? '('+iti.transitDays+'中转)' : ''}</span><span>¥${b.transit}</span></div>
      <div class="budget-row"><span>✨ 购物/其他备用</span><span>¥${b.other}</span></div>
    </div>
    <div class="budget-total"><span>💵 总预算</span><span>¥${b.total}（≈ ¥${b.perDay}/天）</span></div>
  </div>`;
}

function renderFooter() {
  if (state.step === 4) return '';
  const canNext = state.step < 4;
  const nextDisabled = state.step === 1 && state.selectedCities.length === 0;
  const prevBtn = state.step > 1
    ? `<button class="btn-prev" onclick="event.stopPropagation(); prevStep();">← 上一步</button>`
    : '';
  const nextText = state.step === 1 ? '下一步：选景点' : state.step === 2 ? '下一步：住宿/天数' : '✨ 生成我的攻略';
  return `<div class="footer-nav">
    ${prevBtn}
    <button class="btn-next" onclick="event.stopPropagation(); nextStep();" ${nextDisabled ? 'disabled' : ''}>${canNext ? nextText : ''}</button>
  </div>`;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  let body = '';
  if (state.step === 4) {
    body = renderStep4();
  } else {
    body = `<div class="main page active">`;
    body += `<div class="section-title"><span class="num">${state.step}</span> ${
      state.step === 1 ? '选择要去的城市（可多选+跨省份）' :
      state.step === 2 ? '勾选景点和美食（城市分组+3个标签页）' :
      state.step === 3 ? '住宿区域 + 游玩天数 + 预算档位' : '攻略生成中'
    }</div>`;
    if (state.step === 1) body += renderStep1();
    else if (state.step === 2) body += renderStep2();
    else if (state.step === 3) body += renderStep3();
    body += '</div>';
  }
  app.innerHTML = renderHeader() + body + renderFooter();
}

(function initApp(){
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('DOMContentLoaded', function(){ render(); });
  } else {
    render();
  }
})();
</script>
</body>
</html>
};
